[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "economic-recovery-api"
version = "0.1.0"
description = "API for the economic recovery dashboard"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115,<1",
    "pandas>=2.2,<3",
    "lxml>=5.3,<6",
    "playwright==1.49.1",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
    "beautifulsoup4>=4.12,<5",
    "html5lib>=1.1,<2",
    "pytrends>=4.9,<5",
    "feedparser>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "ruff>=0.8,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
